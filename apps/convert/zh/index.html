p:14px}.seo section{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:16px}.seo h2{font-size:1rem;margin:0 0 8px}.seo p{color:var(--muted)}footer{border-top:1px solid var(--line);margin-top:34px;padding-top:20px;color:var(--muted);font-size:.86rem}@media(max-width:780px){.editor,.seo{grid-template-columns:1fr}.nav{margin-left:0}}

  <script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"在线图片格式转换工具","url":"https://convert.imageprivacy.org/zh/","applicationCategory":"MultimediaApplication","operatingSystem":"All","browserRequirements":"Requires JavaScript","isAccessibleForFree":true,"description":"在浏览器中把 HEIC、JPEG、PNG 或 WebP 图片转换为其他格式。","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},"publisher":{"@type":"Organization","name":"ImagePrivacy"}}</script>

<body><header class="header"><div class="container header-inner"><div class="logo">Image Converter</div><div class="tagline">在本地转换 HEIC、PNG、JPEG 和 WebP</div><nav class="nav"><a href="https://imageprivacy.org/zh/">ImagePrivacy</a><a href="/">English</a></nav></div></header>
<main class="main container"><div class="card"><label class="drop"><input id="file" class="file" type="file" accept="image/*,.heic,.heif"><strong>选择要转换的图片</strong><br><span class="hint">从浏览器导出 HEIC、JPEG、PNG 或 WebP。</span></label><div id="editor" class="editor"><div class="preview"><img id="preview" alt=""><p id="meta" class="meta"></p></div><aside class="controls"><div class="control"><label for="format">输出格式</label><select id="format"><option value="image/webp">WebP</option><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option></select></div><div class="control"><label for="quality">质量</label><input id="quality" type="range" min="40" max="100" value="90"><p id="q" class="hint">90%</p></div><div class="control"><label for="bg">JPEG 背景色</label><input id="bg" type="color" value="#ffffff"><p class="hint">透明图片导出为 JPEG 时会使用这个背景色。</p></div><button class="btn" id="download">转换并下载</button><p class="hint">HEIC 文件会先在本地解码，再通过画布导出为元数据更少的新副本。</p></aside></div></div><div class="seo"><section><h2>适用场景</h2><p>适合把 iPhone HEIC 照片、截图、商品图、文档图片或平台专用素材转换为 JPEG、PNG 或 WebP。</p></section><section><h2>隐私说明</h2><p>格式转换不会移除画面中可见的隐私内容。如果图片本身包含敏感细节，请先进行遮挡。</p></section></div><footer><a href="https://imageprivacy.org/zh/privacy/">隐私策略</a> · <a href="https://imageprivacy.org/zh/terms/">服务条款</a></footer></main>
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<script>
  const file=document.getElementById("file"),preview=document.getElementById("preview"),editor=document.getElementById("editor"),format=document.getElementById("format"),quality=document.getElementById("quality"),q=document.getElementById("q"),bg=document.getElementById("bg"),meta=document.getElementById("meta");let img=null,name="image",previewUrl="";
  file.onchange=e=>load(e.target.files[0]);function isHeic(f){return/\.hei[cf]$/i.test(f.name)||/^image\/hei[cf]$/i.test(f.type)}function setPreviewUrl(url){if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=url}async function load(f){if(!f)return;name=f.name.replace(/\.[^.]+$/,"");editor.style.display="grid";meta.textContent=isHeic(f)?"正在本地解码 HEIC...":"正在加载图片...";try{let source=f;if(isHeic(f)){if(!window.heic2any)throw new Error("HEIC 解码器加载失败，请检查网络后重试。");const decoded=await heic2any({blob:f,toType:"image/png",quality:1});source=Array.isArray(decoded)?decoded[0]:decoded}const url=URL.createObjectURL(source);setPreviewUrl(url);img=new Image();img.onload=()=>{preview.src=url;meta.textContent=`来源：${img.width} x ${img.height} · ${f.type||f.name.split(".").pop().toUpperCase()}${isHeic(f)?"，已从 HEIC 解码":""}`};img.onerror=()=>{meta.textContent="这个文件无法在浏览器中解码。"};img.src=url}catch(err){preview.removeAttribute("src");img=null;meta.textContent=err.message||"这个文件无法在浏览器中解码。"}}
  quality.oninput=()=>q.textContent=quality.value+"%";
  document.getElementById("download").onclick=()=>{if(!img)return;const c=document.createElement("canvas"),x=c.getContext("2d");c.width=img.width;c.height=img.height;if(format.value==="image/jpeg"){x.fillStyle=bg.value;x.fillRect(0,0,c.width,c.height)}x.drawImage(img,0,0);const ext=format.value.split("/")[1].replace("jpeg","jpg");c.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`${name}.${ext}`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},format.value,+quality.value/100)};
</script></body></html>
