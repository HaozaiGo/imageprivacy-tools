<!doctype html>

<head>

  <title>在线图片尺寸调整工具 | 在浏览器中缩放照片</title>
  <style>
    :root{--bg:#0f172a;--panel:#1e293b;--input:#111827;--line:#334155;--text:#e2e8f0;--muted:#94a3b8;--blue:#3b82f6;--radius:12px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.55}.container{max-width:1040px;margin:0 auto;padding:0 20px}.header{border-bottom:1px solid var(--line);background:linear-gradient(135deg,#0f172a,#1a2a4a);padding:20px 0}.header-inner{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}.logo{font-size:1.5rem;font-weight:750}.tagline{color:var(--muted);font-size:.92rem}.nav{margin-left:auto}.nav a{color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:.78rem}.main{padding:28px 20px 48px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px}.drop{position:relative;border:2px dashed var(--line);border-radius:10px;padding:34px;text-align:center;background:rgba(255,255,255,.03);cursor:pointer}.file{position:absolute;inset:0;opacity:0;cursor:pointer}.editor{display:none;grid-template-columns:minmax(0,1fr) 280px;gap:18px;margin-top:18px}.preview{background:#0b1220;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}.preview img{max-width:100%;max-height:520px}.controls{display:flex;flex-direction:column;gap:12px}.control{background:rgba(15,23,42,.6);border:1px solid var(--line);border-radius:10px;padding:14px}.control label{display:block;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}input,select{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--input);color:var(--text)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:8px;padding:10px 13px;background:var(--blue);color:#fff;font-weight:650;cursor:pointer}.hint,.meta{color:var(--muted);font-size:.88rem}.seo{margin-top:24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.seo section{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:16px}.seo h2{font-size:1rem;margin:0 0 8px}.seo p{color:var(--muted)}footer{border-top:1px solid var(--line);margin-top:34px;padding-top:20px;color:var(--muted);font-size:.86rem}@media(max-width:780px){.editor,.seo{grid-template-columns:1fr}.nav{margin-left:0}}
  </style>
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"在线图片尺寸调整工具","url":"https://resize.imageprivacy.org/zh/","applicationCategory":"MultimediaApplication","operatingSystem":"All","browserRequirements":"Requires JavaScript","isAccessibleForFree":true,"description":"在浏览器中调整图片尺寸，并导出更适合公开分享的小尺寸副本。","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},"publisher":{"@type":"Organization","name":"ImagePrivacy"}}</script>
</head>
<body><header class="header"><div class="container header-inner"><div class="logo">Image Resizer</div><div class="tagline">分享前生成更小的公开副本</div><nav class="nav"><a href="https://imageprivacy.org/zh/">ImagePrivacy</a><a href="/">English</a></nav></div></header>
<main class="main container"><div class="card"><label class="drop"><input id="file" class="file" type="file" accept="image/*"><strong>选择要调整尺寸的图片</strong><br><span class="hint">文件会在浏览器中解码和导出。</span></label><div id="editor" class="editor"><div class="preview"><img id="preview" alt=""><p id="meta" class="meta"></p></div><aside class="controls"><div class="control"><div class="row"><div><label for="width">宽度</label><input id="width" type="number" min="1"></div><div><label for="height">高度</label><input id="height" type="number" min="1"></div></div><p><label><input id="lock" type="checkbox" checked style="width:auto"> 保持宽高比</label></p></div><div class="control"><label for="format">导出格式</label><select id="format"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></div><div class="control"><label for="quality">质量</label><input id="quality" type="range" min="40" max="100" value="90"><p id="q" class="hint">90%</p></div><button class="btn" id="download">下载调整后的图片</button><p class="hint">画布导出会生成新的副本，并移除大多数嵌入式元数据。</p></aside></div></div><div class="seo"><section><h2>适用场景</h2><p>无需上传源文件，即可为网站、表单、工单、商品平台、社交动态和邮件附件调整图片尺寸。</p></section><section><h2>隐私说明</h2><p>请私下保存原图；当不需要完整分辨率时，分享调整尺寸后的副本。</p></section></div><footer><a href="https://imageprivacy.org/zh/privacy/">隐私策略</a> · <a href="https://imageprivacy.org/zh/terms/">服务条款</a></footer></main>
<script>
  const file=document.getElementById("file"),preview=document.getElementById("preview"),editor=document.getElementById("editor"),w=document.getElementById("width"),h=document.getElementById("height"),lock=document.getElementById("lock"),format=document.getElementById("format"),quality=document.getElementById("quality"),q=document.getElementById("q"),meta=document.getElementById("meta");let img=null,ratio=1,name="image";
  file.onchange=e=>load(e.target.files[0]);function load(f){if(!f)return;name=f.name.replace(/\.[^.]+$/,"");const url=URL.createObjectURL(f);img=new Image();img.onload=()=>{ratio=img.width/img.height;w.value=img.width;h.value=img.height;preview.src=url;editor.style.display="grid";meta.textContent=`原图：${img.width} x ${img.height} · ${(f.size/1024/1024).toFixed(2)} MB`};img.src=url}
  w.oninput=()=>{if(lock.checked&&ratio)h.value=Math.round(+w.value/ratio)};h.oninput=()=>{if(lock.checked&&ratio)w.value=Math.round(+h.value*ratio)};quality.oninput=()=>q.textContent=quality.value+"%";
  document.getElementById("download").onclick=()=>{if(!img)return;const c=document.createElement("canvas"),x=c.getContext("2d");c.width=Math.max(1,+w.value||img.width);c.height=Math.max(1,+h.value||img.height);x.drawImage(img,0,0,c.width,c.height);const ext=format.value.split("/")[1].replace("jpeg","jpg");c.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`${name}-${c.width}x${c.height}.${ext}`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},format.value,+quality.value/100)};
</script></body></html>
